<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="TaskFlow">
  <defs>
    <linearGradient id="tf-bg" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="tf-flow" x1="10" y1="34" x2="38" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <filter id="tf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="48" height="48" rx="13" fill="url(#tf-bg)"/>

  <!-- Flow path: start → task → done -->
  <path
    d="M11 32 C16 18, 22 16, 24 22 C26 28, 30 30, 37 18"
    stroke="url(#tf-flow)"
    stroke-width="2.6"
    stroke-linecap="round"
    fill="none"
    filter="url(#tf-glow)"
    opacity="0.95"
  />

  <!-- Arrow head -->
  <path
    d="M33 17 L37 18 L35 22"
    stroke="#A5F3FC"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Nodes -->
  <circle cx="11" cy="32" r="4.2" fill="#fff" opacity="0.95"/>
  <circle cx="24" cy="22" r="4.8" fill="#fff"/>
  <circle cx="37" cy="18" r="4.2" fill="#67E8F9"/>

  <!-- Inner dots -->
  <circle cx="11" cy="32" r="1.6" fill="#4338CA"/>
  <circle cx="24" cy="22" r="1.8" fill="#4F46E5"/>
  <circle cx="37" cy="18" r="1.6" fill="#0891B2"/>
</svg>
