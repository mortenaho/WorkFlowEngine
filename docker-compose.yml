services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  engine:
    build: .
    ports:
      - "8082:8080"
    environment:
      ADDR: ":8080"
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Required outside Development. Copy .env.example to .env (compose loads .env automatically).
      WF_API_KEYS: ${WF_API_KEYS:?Set WF_API_KEYS (copy .env.example to .env)}
      DATABASE_URL: Host=postgres;Port=5432;Username=workflow;Password=workflow;Database=workflow;SSL Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
